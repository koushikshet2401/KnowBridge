version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: knowbridge_postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: knowbridge_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
