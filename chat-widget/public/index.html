<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaty Chat Widget Test</title>
</head>
<body>
  <div id="chaty-chat-root"></div>
  <script>
    // Provide config for the widget so it knows where the backend is
    window.CHAT_CONFIG = {
      apiUrl: 'http://localhost:5000',
      theme: 'purple'
    };
    
    // Webpack will inject the JS bundle after this. 
    // We wait for DOMContentLoaded to ensure the bundle has executed and attached ChatyChat to window.
    window.addEventListener('load', () => {
      if (window.ChatyChat) {
        window.ChatyChat.init();
      } else {
        console.error("ChatyChat is not defined on window yet.");
      }
    });
  </script>
</body>
</html>
